name: CI

# Every branch is tested on push, so feature branches are green before merging.
# The HF Space deploy (sync-to-hf.yml) only runs after this workflow succeeds on main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Prepare processed dataset
        run: python -m src.data.prepare_dataset --config configs/data.yaml

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest + coverage gate)
        # Training/eval scripts that need real model weights are run manually
        # and are not part of the gate; 65% guards against coverage regressions.
        run: pytest -q --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=65

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
