# ---------------------------------------------------------------------------
# Konfigurasi Agentic layer (Fase 6).
# Pola sama seperti configs/rag.yaml: threshold, path storage, provider notif.
# ---------------------------------------------------------------------------

router:
  # Emosi yang dianggap "urgent" -> perlu perhatian manusia + notifikasi.
  escalate_label: "anger"
  # Anger dengan confidence >= ambang ini di-escalate (prioritas tinggi).
  # Ambang inklusif: confidence == threshold ikut ter-escalate.
  escalate_min_confidence: 0.75
  # Emosi negatif yang cukup dibuatkan draft empati (approval biasa).
  draft_labels: ["anger", "sadness"]
  # Emosi positif -> tidak ada aksi, cukup di-arsipkan.
  archive_labels: ["happiness"]

draft:
  # Berapa review serupa yang di-retrieve untuk grounding draft (anti-halusinasi).
  top_k: 5
  # Suhu generation rendah supaya draft konsisten & sopan.
  temperature: 0.3
  max_tokens: 400

queue:
  # SQLite baru khusus antrean tiket agent (pola mirip mlflow.db).
  db_path: "agent_queue.db"

notifier:
  # "telegram" jika token+chat_id tersedia, jika tidak fallback ke "file".
  provider: "telegram"
  # Fallback log ketika Telegram tidak dikonfigurasi (risiko & mitigasi PLAN).
  fallback_log_path: "data/monitoring/escalations.log"

evaluation:
  # Offline evaluation of routing decisions (src/agent/evaluate_agent.py).
  # Labeled test split -> classifier -> router, compared with gold-label routing.
  test_csv: "data/processed/test.csv"
  # Values of escalate_min_confidence to compare (precision vs recall trade-off).
  threshold_sweep: [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  report_path: "reports/agent_eval_report.md"
